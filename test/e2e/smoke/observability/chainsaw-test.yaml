apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke-observability
spec:
  bindings:
  - name: spark_version
    value: ($values.product_version)
  - name: SPARK_MINIO_USER
    value: spark
  - name: SPARK_MINIO_PASSWORD
    value: sparkspark
  - name: SPARK_MINIO_BUCKET
    value: spark-history
  steps:
  # 0. Install MinIO for S3 storage
  - name: install minio
    try:
    - apply:
        file: ../../setup/minio.yaml
    - assert:
        file: ../../setup/minio-assert.yaml

  # 1. Install SparkHistoryServer
  - name: install spark
    try:
      - apply:
          file: ../../setup/minio-s3-connection.yaml
      - apply:
          file: sparkhistoryserver.yaml
      - assert:
          file: sparkhistoryserver-assert.yaml
      - assert:
          timeout: 240s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: test-spark-observability-node-default
              namespace: ($namespace)
            status:
              readyReplicas: 2

  # 2. Verify metrics port connectivity and format
  - name: verify metrics connectivity
    try:
      - script:
          bindings:
          - name: NAMESPACE
            value: ($namespace)
          content: |
            #!/bin/bash
            set -ex

            # Get all pods
            echo "Namespace: $NAMESPACE"
            PODS=$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/component=node,app.kubernetes.io/instance=test-spark-observability -o jsonpath='{.items[*].metadata.name}')
            echo "Found pods: $PODS"

            for POD in $PODS; do
              echo "Testing Pod: $POD"

              # Port-forward to pod
              kubectl port-forward -n "$NAMESPACE" "$POD" 18081:18081 > /dev/null 2>&1 &
              PF_PID=$!
              sleep 2

              trap "kill $PF_PID 2>/dev/null || true" EXIT

              # Test metrics endpoint accessibility
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18081/metrics)
              if [ "$HTTP_CODE" != "200" ]; then
                echo "ERROR: Failed to access metrics endpoint, HTTP code: $HTTP_CODE"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi

              # Fetch metrics
              METRICS=$(curl -s http://localhost:18081/metrics)

              # Verify Prometheus format
              if ! echo "$METRICS" | grep -q "# TYPE"; then
                echo "ERROR: Missing Prometheus format (# TYPE)"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi

              # Verify JVM metrics present
              if ! echo "$METRICS" | grep -q "jvm_"; then
                echo "ERROR: Missing JVM metrics"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi

              # Verify specific metrics (arbitrary metric to ensure data is present)
              if ! echo "$METRICS" | grep -q "jvm_memory_used_bytes"; then
                echo "WARNING: Expected metric 'jvm_memory_used_bytes' not found"
              fi

              echo "✓ Pod $POD metrics OK"

              # Cleanup
              kill $PF_PID 2>/dev/null || true
              sleep 1
            done

            echo "✓ All pods metrics verified"

            # Prove the metrics Service itself routes to the JMX port. Pod port-forwarding above
            # deliberately bypasses Service targetPort resolution.
            kubectl port-forward -n "$NAMESPACE" \
              svc/test-spark-observability-node-default-metrics 18082:18081 > /dev/null 2>&1 &
            SERVICE_PF_PID=$!
            trap "kill $SERVICE_PF_PID 2>/dev/null || true" EXIT
            SERVICE_OK=false
            for _ in $(seq 1 20); do
              if SERVICE_METRICS=$(curl --fail --silent http://localhost:18082/metrics) && \
                echo "$SERVICE_METRICS" | grep -q "# TYPE"; then
                SERVICE_OK=true
                break
              fi
              sleep 1
            done
            kill $SERVICE_PF_PID 2>/dev/null || true
            if [ "$SERVICE_OK" != true ]; then
              echo "ERROR: metrics Service did not route to a Prometheus endpoint"
              exit 1
            fi

            echo "✓ Metrics Service routing verified"

  # 3. Install Prometheus
  - name: install prometheus
    try:
      - script:
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -ex

            echo "=== Environment Check ==="
            echo "NAMESPACE variable: '$NAMESPACE'"
            echo "NAMESPACE length: ${#NAMESPACE}"
            if [ -z "$NAMESPACE" ]; then
              echo "ERROR: NAMESPACE is empty!"
              exit 1
            fi

            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
            helm repo update

            echo "=== Installing Prometheus ==="
            echo "Will install to namespace: $NAMESPACE"

            helm upgrade --install prometheus prometheus-community/prometheus \
              --version 25.3.1 \
              --namespace "$NAMESPACE" \
              --create-namespace \
              -f prometheus-values.yaml \
              --wait --timeout 5m

  # 4. Verify Prometheus targets
  - name: verify prometheus targets
    try:
      - script:
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -e

            # Wait for Prometheus server pod
            kubectl wait --for=condition=Ready pod -l app=prometheus,component=server -n "$NAMESPACE" --timeout=300s 2>/dev/null || true
            sleep 3

            # Port-forward
            kubectl port-forward -n "$NAMESPACE" svc/prometheus-server 9090:80 > /dev/null 2>&1 &
            PF_PID=$!
            sleep 2

            trap "kill $PF_PID 2>/dev/null || true" EXIT

            echo "=== Checking Prometheus target ==="
            QUERY='min(up{service="test-spark-observability-node-default-metrics",namespace="'"$NAMESPACE"'"})'
            TARGET_UP=false
            for _ in $(seq 1 30); do
              RESULT=$(curl --fail --silent --get \
                --data-urlencode "query=$QUERY" \
                http://localhost:9090/api/v1/query || true)
              if echo "$RESULT" | grep -q '"result":\[{' && echo "$RESULT" | grep -q '"value":\[[^]]*,"1"\]'; then
                TARGET_UP=true
                break
              fi
              sleep 5
            done

            if [ "$TARGET_UP" != true ]; then
              echo "ERROR: SparkHistoryServer metrics target was not UP"
              curl --fail --silent http://localhost:9090/api/v1/targets || true
              exit 1
            fi

            echo "✓ SparkHistoryServer metrics target is UP"
